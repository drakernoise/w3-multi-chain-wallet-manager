<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Wallet Test dApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input,
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            margin-top: 20px;
            padding: 16px;
            border-radius: 10px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            border: 2px solid #28a745;
            color: #155724;
        }

        .result.error {
            background: #f8d7da;
            border: 2px solid #dc3545;
            color: #721c24;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .result-content {
            font-size: 14px;
            word-break: break-all;
        }

        .info-box {
            background: #e7f3ff;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: #333;
            font-size: 14px;
            line-height: 1.6;
        }

        .info-box strong {
            color: #667eea;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Gravity Wallet Test</h1>
        <p class="subtitle">Test dApp for Mobile Provider</p>

        <div class="info-box">
            <p><strong>Instructions:</strong></p>
            <p>1. Open this page on your mobile device</p>
            <p>2. Fill in the form below</p>
            <p>3. Click "Request Signature"</p>
            <p>4. Approve in Gravity Wallet app</p>
        </div>

        <form id="testForm">
            <div class="form-group">
                <label for="operation">Operation Type</label>
                <select id="operation" required>
                    <option value="transfer">Transfer</option>
                    <option value="vote">Vote</option>
                    <option value="post">Post</option>
                    <option value="comment">Comment</option>
                    <option value="delegate">Delegate</option>
                    <option value="powerup">Power Up</option>
                    <option value="powerdown">Power Down</option>
                </select>
            </div>

            <div class="form-group" id="transferFields">
                <label for="to">To (username)</label>
                <input type="text" id="to" placeholder="recipient" required>

                <label for="amount" style="margin-top: 12px;">Amount</label>
                <input type="number" id="amount" placeholder="10.000" step="0.001" required>

                <label for="memo" style="margin-top: 12px;">Memo</label>
                <input type="text" id="memo" placeholder="Payment for services">

                <label for="symbol" style="margin-top: 12px;">Symbol</label>
                <select id="symbol">
                    <option value="HIVE">HIVE</option>
                    <option value="STEEM">STEEM</option>
                    <option value="BLURT">BLURT</option>
                </select>
            </div>

            <button type="submit">Request Signature</button>
        </form>

        <div id="result" class="result">
            <div class="result-title"></div>
            <div class="result-content"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('testForm');
        const resultDiv = document.getElementById('result');
        const resultTitle = resultDiv.querySelector('.result-title');
        const resultContent = resultDiv.querySelector('.result-content');

        // Handle form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const operation = document.getElementById('operation').value;
            const params = {
                domain: window.location.hostname || 'testdapp.local',
                operation: operation,
                callback: window.location.href
            };

            // Add operation-specific parameters
            if (operation === 'transfer') {
                params.to = document.getElementById('to').value;
                params.amount = document.getElementById('amount').value;
                params.memo = document.getElementById('memo').value;
                params.symbol = document.getElementById('symbol').value;
            }

            // Build deep link URL
            const urlParams = new URLSearchParams(params);
            const deepLink = `gravitywallet://sign?${urlParams.toString()}`;

            console.log('Deep link:', deepLink);

            // Show pending state
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultTitle.textContent = '⏳ Waiting for approval...';
            resultContent.textContent = 'Please approve the transaction in Gravity Wallet';

            // Redirect to Gravity Wallet
            window.location.href = deepLink;
        });

        // Handle callback from Gravity Wallet
        window.addEventListener('load', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const success = urlParams.get('success');

            if (success === 'true') {
                const signature = urlParams.get('signature');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result success';
                resultTitle.textContent = '✅ Transaction Approved!';
                resultContent.innerHTML = `
                    <strong>Signature:</strong><br>
                    ${signature}
                `;

                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            } else if (success === 'false') {
                const error = urlParams.get('error');
                resultDiv.style.display = 'block';
                resultDiv.className = 'result error';
                resultTitle.textContent = '❌ Transaction Rejected';
                resultContent.innerHTML = `
                    <strong>Error:</strong><br>
                    ${error || 'User rejected the request'}
                `;

                // Clean URL
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });

        // Show/hide fields based on operation
        document.getElementById('operation').addEventListener('change', (e) => {
            const transferFields = document.getElementById('transferFields');
            if (e.target.value === 'transfer') {
                transferFields.style.display = 'block';
            } else {
                transferFields.style.display = 'none';
            }
        });
    </script>
</body>

</html>
