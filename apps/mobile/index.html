<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mobile</title>
  <script>
    /* Polyfills for legacy libraries (blurtjs, dsteem) on Android WebView */
    if (typeof globalThis === 'undefined') {
      (function () {
        if (typeof self !== 'undefined') { self.globalThis = self; }
        else if (typeof window !== 'undefined') { window.globalThis = window; }
        else { Function('return this')().globalThis = Function('return this')(); }
      })();
    }

    // Fix 'exports is not defined' and 'module is not defined'
    window.exports = window.exports || {};
    window.module = window.module || { exports: window.exports };

    // Explicit generic process shim (if not provided by bundler yet)
    if (!window.process) {
      window.process = { env: { NODE_DEBUG: false, NODE_ENV: 'production' }, version: '' };
    }

    // Fix 'Illegal invocation' for libraries using unbounded fetch
    if (window.fetch) {
      const originalFetch = window.fetch;
      window.fetch = function (url, options) {
        return originalFetch.call(window, url, options);
      };
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
